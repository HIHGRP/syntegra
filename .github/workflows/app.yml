name: Application

on:
  push:
    paths: ["src/**", "tests/**", "ceda/**", "pyproject.toml", "manage.py", "deploy/**", ".github/workflows/app.yml"]
  pull_request:
    paths: ["src/**", "tests/**", "ceda/**", "pyproject.toml", "manage.py", "deploy/**", ".github/workflows/app.yml"]

jobs:
  quality:
    name: Lint, types, architecture boundaries, generated models
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries for mysqlclient
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends default-libmysqlclient-dev pkg-config
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Django models match the CEDA model
        run: python ceda/tools/gen_django.py check
      - name: ruff
        run: ruff check src tests manage.py ceda/tools/gen_django.py && ruff format --check src tests
      - name: mypy (strict on kernel and domain packages)
        run: mypy
      - name: import-linter (module boundaries)
        run: PYTHONPATH=src lint-imports

  tests:
    name: Tests on MySQL 9.7
    runs-on: ubuntu-26.04
    services:
      mysql:
        image: mysql:9.7
        env:
          MYSQL_ROOT_PASSWORD: ceda
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pceda"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      SYNTEGRA_DB_HOST: 127.0.0.1
      SYNTEGRA_DB_USER: root
      SYNTEGRA_DB_PASSWORD: ceda
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries for mysqlclient
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends default-libmysqlclient-dev pkg-config
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Django system checks
        run: python manage.py check --settings=syntegra.settings.test
      - name: Unit and integration tests (real MySQL, all six zones)
        run: python -m pytest tests -q --create-db
