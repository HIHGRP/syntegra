[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "syntegra"
version = "0.1.0"
description = "Syntegra Intelligent EMIS/SMIS — enterprise Python application built on the Canonical Enterprise Data Architecture (SYN-CEDA-001)"
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = { text = "Proprietary — Syntegra Digital Infrastructure Nigeria Ltd" }
dependencies = [
  "Django==5.2.7",
  "djangorestframework==3.16.1",
  "mysqlclient==2.2.7",
  "cryptography==45.0.7",
  "argon2-cffi==25.1.0",
  "PyYAML==6.0.2",
  "Jinja2==3.1.6",
  "celery==5.5.3",
  "gunicorn==23.0.0",
  "segno==1.6.6",
  "pypdf==6.19.0",
  # single sign-on (CR-003, CR-008): OpenID Connect ID tokens verified against the provider's published keys
  "PyJWT==2.15.1",
  # OCR of scanned documents (CR-007): wheels that carry Tesseract 5 / Leptonica, PDFium and the image codecs
  "tesserocr==2.12.0",
  "pypdfium2==5.14.0",
  "pillow==13.0.0",
  # write-once document masters in S3-compatible object storage with object lock (CR-008)
  "boto3==1.43.105",
  "botocore==1.43.105",
  # report cards written as PDF (CR-009)
  "fpdf2==2.8.3",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "pytest-django==4.11.1",
  "ruff==0.13.3",
  "mypy==1.18.2",
  "django-stubs==5.2.5",
  "djangorestframework-stubs==3.16.4",
  "import-linter==2.5",
  "types-PyYAML",
  "moto[s3]==5.2.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
syntegra = ["**/templates/**/*", "**/static/**/*"]

# --------------------------------------------------------------------- tests (MFS §16.7: real MySQL 9.7, never SQLite)
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "syntegra.settings.test"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers --reuse-db"
markers = ["slow: long-running tests"]

# --------------------------------------------------------------------- lint and format
[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]
extend-exclude = ["src/syntegra/*/models.py"]  # generated from CEDA

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "DJ", "PT", "SIM", "RUF"]
ignore = ["S101", "RUF012", "DJ001", "S608", "RUF001", "RUF002", "RUF003"]  # en dashes and ≥ are intentional in prose

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "PT018"]
"src/syntegra/security_training/reference.py" = ["E501"]
"src/syntegra/regulation/reference.py" = ["E501"]
"src/syntegra/federal_institutions/reference.py" = ["E501"]
"src/syntegra/security_training/curricula.py" = ["E501"]
"src/syntegra/platform/demo/*.py" = ["E501", "B023", "S105", "S311", "RUF005"]  # synthetic demonstration data generator (development only)  # reference tables read best one record per line

# --------------------------------------------------------------------- typing (strict on the kernel and domain packages)
[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
mypy_path = "src"
packages = ["syntegra"]
ignore_missing_imports = true
warn_unused_ignores = true
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["syntegra.*.models", "syntegra.*.migrations.*"]  # generated from CEDA
ignore_errors = true

[[tool.mypy.overrides]]
module = ["syntegra.core.*", "syntegra.*.domain.*"]
strict = true
disallow_subclassing_any = false
disallow_untyped_calls = false

[tool.django-stubs]
django_settings_module = "syntegra.settings.test"

# --------------------------------------------------------------------- module boundaries (MFS §16.7, Book 3 §5.5)
[tool.importlinter]
root_package = "syntegra"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The kernel depends on no business module"
type = "forbidden"
source_modules = ["syntegra.core"]
forbidden_modules = [
  "syntegra.institutions", "syntegra.providers", "syntegra.learners", "syntegra.families", "syntegra.people",
  "syntegra.academic", "syntegra.curriculum", "syntegra.timetable", "syntegra.attendance", "syntegra.assessment",
  "syntegra.certificates", "syntegra.success", "syntegra.safeguarding", "syntegra.sectors", "syntegra.lms",
  "syntegra.comms", "syntegra.finance", "syntegra.financing", "syntegra.operations", "syntegra.forms",
  "syntegra.records", "syntegra.intelligence", "syntegra.reporting", "syntegra.integration", "syntegra.analytics",
  "syntegra.funding", "syntegra.estate",
]

[[tool.importlinter.contracts]]
name = "Domain packages are framework-free (no Django, no DRF)"
type = "forbidden"
source_modules = [
  "syntegra.learners.domain", "syntegra.attendance.domain", "syntegra.certificates.domain",
  "syntegra.curriculum.domain", "syntegra.financing.domain", "syntegra.institutions.domain",
  "syntegra.hr.domain", "syntegra.clearance.domain", "syntegra.families.domain", "syntegra.funding.domain",
  "syntegra.estate.domain",
]
forbidden_modules = ["django", "rest_framework"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Education services never read payment or subscription state (P9, FR-SUB-116)"
type = "forbidden"
source_modules = ["syntegra.attendance", "syntegra.assessment", "syntegra.certificates", "syntegra.lms", "syntegra.learners"]
forbidden_modules = ["syntegra.finance", "syntegra.financing", "syntegra.funding", "syntegra.platform.services"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Fee clearance sees published obligation summaries only, never ledgers or SDAF (CR-001, P9)"
type = "forbidden"
source_modules = ["syntegra.clearance"]
forbidden_modules = ["syntegra.finance", "syntegra.financing", "syntegra.funding"]

[[tool.importlinter.contracts]]
name = "Only the safeguarding and success modules touch the special-category vault models"
type = "forbidden"
source_modules = [
  "syntegra.learners", "syntegra.attendance", "syntegra.assessment", "syntegra.certificates", "syntegra.lms",
  "syntegra.comms", "syntegra.finance", "syntegra.financing", "syntegra.reporting", "syntegra.analytics",
  "syntegra.hr", "syntegra.clearance", "syntegra.funding", "syntegra.estate",
]
forbidden_modules = ["syntegra.safeguarding.models"]
allow_indirect_imports = true
