  events:
  - AUTH.SIGNED_IN
  - AUTH.FAILED
  - AUTH.LOCKED
  fields:
  - label: Email or username
    type: email
    required: true
    rule: Trimmed, case-insensitive; max 254 chars
  - label: Password
    type: password
    required: true
    rule: Never logged; 12+ chars policy enforced at creation
  - label: Remember this device
    type: checkbox
    required: false
    rule: null
