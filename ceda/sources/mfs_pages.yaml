  pattern: Authentication
  route: /auth/mfa
  classification: Internal
  phase: P1
  roles:
  - All authenticated users
  source: §63
  purpose: Second factor for users whose role clearance is restricted or special, and for any user on a new device.
  objects: []
  api_calls:
  - POST /api/v1/auth/mfa/verify
  events:
  - AUTH.MFA_PASSED
  - AUTH.MFA_FAILED
  fields:
  - label: 6-digit code
    type: number
    required: true
    rule: Exactly 6 digits; TOTP ±1 step or SMS/e-mail OTP valid 5 min
  - label: Use a passkey instead
    type: switch
    required: false
    rule: null
