- id: AUT-01
  title: Sign in
  module: Access
  pattern: Authentication
  route: /auth/sign-in
  classification: Internal
  phase: P1
  roles:
  - All authenticated users
  source: §58, §59, §63
  purpose: Authenticate every user through one entry point. Supports federated SSO (government identity provider, Microsoft
    Entra ID, Google Workspace), local credentials for small institutions and passwordless magic links for parents.
