  module: WEL
- id: FR-WEL-101
  text: Let learners and parents report wellbeing concerns in the app with configurable concern types, routed to a pastoral
    lead within a set time, with DSL alert on safeguarding keywords.
  priority: SHALL
  phase: P2
  module: WEL
- id: FR-WEL-102
  text: Let staff record wellbeing observations on a five-point scale and configurable trackers, shown alongside learner and
    parent reports.
  priority: SHOULD
  phase: P2
  module: WEL
- id: FR-WEL-103
  text: Provide wellbeing analytics by source and group, counsellor caseload, and the impact of each intervention as wellbeing
    before and after.
  priority: SHALL
  phase: P2
  module: WEL
- id: NFR-A11Y-01
  text: WCAG 2.2 AA across all pages; AAA contrast in high-contrast theme; tested with assistive technology each release.
  area: A11Y
- id: NFR-A11Y-101
  text: All v2 pages WCAG 2.2 AA; parent and learner portals tested with low-literacy users and screen-reader users in English
    and at least one Nigerian language.
  area: A11Y
- id: NFR-AVAIL-01
  text: Availability 99.9% monthly (standard) / 99.95% (government contract tier), excluding announced maintenance (≤ 4 h/month,
    outside school hours).
  area: AVAIL
- id: NFR-AVAIL-02
  text: RPO ≤ 15 minutes, RTO ≤ 4 hours (standard); RPO ≤ 5 minutes, RTO ≤ 1 hour (government tier).
  area: AVAIL
- id: NFR-AVAIL-03
  text: Multi-AZ deployment; cross-region (in-country where residency requires) encrypted backups; quarterly DR test with
    report.
  area: AVAIL
- id: NFR-AVAIL-04
  text: 'Graceful degradation: if analytics is down, operational pages still work; if messaging is down, messages queue.'
  area: AVAIL
- id: NFR-AVAIL-101
  text: Government tier 99.95% monthly for the central dashboard, verification and registers; LMS 99.9%, with offline mode
    covering outages.
  area: AVAIL
- id: NFR-I18N-01
  text: UI fully translatable; English, French, Spanish, Portuguese, Arabic (RTL), German, Chinese, Japanese, Hausa, Igbo,
    Yorùbá at launch of the respective markets.
  area: I18N
- id: NFR-MAINT-01
  text: Module import contracts enforced in CI; ≥ 85% line coverage on domain packages; type-checked; ADRs for architecture
    decisions; zero-downtime migrations.
  area: MAINT
- id: NFR-OBS-01
  text: OpenTelemetry traces across web, workers and adapters; RED metrics per endpoint; SLO dashboards and burn-rate alerts;
    structured logs without personal data.
  area: OBS
- id: NFR-PERF-01
  text: Page server render ≤ 300 ms p95 for list/record pages; dashboards ≤ 800 ms p95 from warehouse cache.
  area: PERF
- id: NFR-PERF-02
  text: 'Core Web Vitals at p75 on a mid-range Android over 3G-fast: LCP < 2.5 s, INP < 200 ms, CLS < 0.1.'
  area: PERF
- id: NFR-PERF-03
  text: API p95 ≤ 250 ms for reads, ≤ 500 ms for writes; public verification ≤ 300 ms p95.
  area: PERF
- id: NFR-PERF-04
  text: Register submission for 40 learners ≤ 1 s round trip.
  area: PERF
- id: NFR-PERF-05
  text: Billing run for 50,000 learners ≤ 15 minutes; eligibility run for 100,000 candidates ≤ 30 minutes.
  area: PERF
- id: NFR-PERF-101
  text: 'LMS: assignment publish to learner devices ≤ 2 minutes; submission upload of 10 MB on 3G-fast ≤ 60 s with resumable
    upload; marking view opens ≤ 1.5 s p95.'
  area: PERF
- id: NFR-PERF-102
  text: 'Central dashboard: state-level tiles ≤ 2 s p95 from cache; live tiles refreshed every ≤ 15 minutes in school hours.'
  area: PERF
- id: NFR-PERF-103
  text: 'Records search: ≤ 1.5 s p95 across 50 million indexed pages per state.'
  area: PERF
- id: NFR-PERF-104
  text: Certificate verification ≤ 300 ms p95; registry propagation ≤ 60 s.
  area: PERF
- id: NFR-PLAT-101
  text: Run all server components on Red Hat Enterprise Linux 10 (or RHEL-based UBI 10 container images on OpenShift).
  priority: SHALL
  phase: P0
  area: PLAT
- id: NFR-PLAT-102
  text: Use MySQL 9.7 LTS as the operational database with the configuration baseline in 16.5; no Innovation releases in production.
  priority: SHALL
  phase: P0
  area: PLAT
- id: NFR-PLAT-103
  text: Implement the PostgreSQL-to-MySQL design mappings in 16.2 and deliver the MySQL DDL as code.
  priority: SHALL
  phase: P0
  area: PLAT
- id: NFR-PLAT-104
  text: Enforce tenant isolation with the four layers in 16.3, with automated cross-tenant leakage tests that block release
    on failure.
  priority: SHALL
  phase: P0
  area: PLAT
- id: NFR-PLAT-105
  text: Deploy MySQL as InnoDB Cluster with a ClusterSet replica in a second in-country site, meeting the RPO and RTO in 16.4.
  priority: SHALL
  phase: P0
  area: PLAT
- id: NFR-PLAT-106
  text: Encrypt MySQL data, redo, undo and binary logs at rest with keys in an external key manager; encrypt sensitive fields
    in the application.
  priority: SHALL
  phase: P0
  area: PLAT
- id: NFR-PLAT-107
  text: Harden RHEL hosts to CIS Level 2 (or DISA STIG), with SELinux enforcing and FIPS mode for the government tier.
  priority: SHALL
  phase: P0
  area: PLAT
- id: NFR-PLAT-108
  text: Build the application on Python 3.12 and Django 5.2 LTS, following the standards in 16.7.
  priority: SHALL
  phase: P0
  area: PLAT
- id: NFR-PLAT-109
  text: Run database tests against MySQL 9.7 in CI.
  priority: SHALL
  phase: P0
  area: PLAT
- id: NFR-PLAT-110
  text: Keep analytics on a separate store fed by CDC so analytical queries never run on the operational primary.
  priority: SHALL
  phase: P6
  area: PLAT
- id: NFR-PLAT-111
  text: Upgrade MySQL, Django and RHEL only within supported LTS paths, with a rehearsed upgrade in staging.
  priority: SHALL
  phase: Ongoing
  area: PLAT
- id: NFR-PLAT-112
  text: Store all text as utf8mb4 and pass a test suite of names with Nigerian-language diacritics and Arabic script through
    every form, search and export.
  priority: SHALL
  phase: P0
  area: PLAT
- id: NFR-PORT-01
  text: Runs on any Kubernetes (EKS, AKS, GKE, on-prem/sovereign cloud); S3-compatible storage; no proprietary database features
    beyond PostgreSQL extensions listed.
  area: PORT
- id: NFR-PRIV-01
  text: Compliance by configuration with NDPA 2023 (Nigeria), UK GDPR / Data Protection Act 2018, EU GDPR and other local
    laws; DPIA for each deployment and each AI model.
  area: PRIV
- id: NFR-PRIV-02
  text: Data minimisation, purpose limitation, retention schedules enforced automatically; legal holds.
  area: PRIV
- id: NFR-PRIV-03
  text: Data-subject rights handled in ADM-10 within statutory deadlines; children's data handled with age-appropriate design.
  area: PRIV
- id: NFR-PRIV-04
  text: 'Residency: data stored and processed in the configured region; sub-processors listed and approved.'
  area: PRIV
- id: NFR-PRIV-101
  text: WhatsApp and Zenzap processing covered by data-processing agreements; no special-category content on external channels;
    NDPA 2023 assessments for each channel.
  area: PRIV
- id: NFR-PRIV-102
  text: Facial match for reissue only with explicit consent, templates discarded after the check, and a non-biometric alternative
    always offered.
  area: PRIV
- id: NFR-SCAL-01
  text: 'National deployment target: 50 million learners, 1.5 million staff, 150,000 institutions per country tenant.'
  area: SCAL
- id: NFR-SCAL-02
  text: 'Peak: 2 million registers between 07:30 and 09:30 local time; 20,000 verifications/minute during admissions season.'
  area: SCAL
- id: NFR-SCAL-03
  text: Horizontal scaling of web and worker tiers; database read replicas; partitioning of attendance, audit and ledger tables
    by time.
  area: SCAL
- id: NFR-SCAL-101
  text: 'Messaging gateway: 2 million messages per day per state, bursts of 500 messages per second, provider throughput limits
    respected with queueing.'
  area: SCAL
- id: NFR-SCAL-102
  text: 'LMS storage: 5 GB per institution per session included, elastic beyond; submissions retained per the retention schedule.'
  area: SCAL
- id: NFR-SCAL-103
  text: 'Digitisation: ingest 500,000 pages per day per state across hubs.'
  area: SCAL
- id: NFR-SEC-01
  text: ISO 27001-aligned ISMS; ISO 27701 privacy extension; annual penetration test and continuous DAST/SAST/dependency scanning.
  area: SEC
- id: NFR-SEC-02
  text: TLS 1.2+ (1.3 preferred), HSTS; encryption at rest (AES-256) with per-tenant keys; field-level encryption for restricted/special
    data.
  area: SEC
- id: NFR-SEC-03
  text: OWASP ASVS Level 2 (Level 3 for certificate issuance, identity and payments).
  area: SEC
- id: NFR-SEC-04
  text: Secrets in a vault; no secrets in code or images; key rotation ≤ 12 months; certificate signing keys in HSM.
  area: SEC
- id: NFR-SEC-05
  text: Security headers (CSP without unsafe-inline for scripts, X-Frame-Options/frame-ancestors, Referrer-Policy, Permissions-Policy).
  area: SEC
- id: NFR-SEC-06
  text: 'Vulnerability SLAs: critical 7 days, high 30 days.'
  area: SEC
- id: NFR-SEC-101
  text: 'Agents: separate service identities, least privilege, no standing access to special-category data, full action logs,
    quarterly red-team test of prompt-injection defences.'
  area: SEC
- id: NFR-SEC-102
  text: 'Messaging: provider tokens in the vault, webhook signatures verified, phone numbers stored hashed for lookup and
    encrypted at rest.'
  area: SEC
- id: NFR-SEC-103
  text: 'Digitisation: WORM storage for masters, hashes verified on every read, scanning hubs with access control, CCTV and
    clean-desk policy; operators vetted.'
  area: SEC
- id: NFR-SEC-104
  text: 'Certificates: HSM-held signing keys, key ceremony with ministry witnesses, dual control for key use, annual rotation
    of issuing keys with long-lived verification of old signatures.'
  area: SEC
