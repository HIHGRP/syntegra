# Extracted from SYN-MFS-002 v2.4 (consolidated single volume) by ceda tooling.
# Do not edit by hand; regenerate from the specification.
requirements:
- id: FR-ACA-01
  text: Use country education-level and grade codes; institutions choose from them and cannot invent new level codes.
  priority: SHALL
  phase: P1
  module: ACA
- id: FR-ACA-02
  text: Inherit the state/country academic calendar; institutions may add closures but cannot reduce teaching days below the
    curriculum minimum without an approved exception.
  priority: SHALL
  phase: P1
  module: ACA
- id: FR-ACA-03
  text: Maintain subject/course catalogue mapped to Subject 360 and to curricula.
  priority: SHALL
  phase: P1
  module: ACA
- id: FR-ACA-04
  text: Build programmes from components with credits, core/elective status, prerequisites (cycle-checked), progression and
    award rules, classification scheme and accrediting body.
  priority: SHALL
  phase: P5
  module: ACA
- id: FR-ACA-05
  text: Provide a teacher class page with roster, today's lessons, authorised adjustments, homework and quick actions (ACA-05).
  priority: SHALL
  phase: P1
  module: ACA
- id: FR-ACA-06
  text: Support semesters, sessions, terms, modules and credits for tertiary institutions, and terms/arms for schools, in
    the same model.
  priority: SHALL
  phase: P1
  module: ACA
- id: FR-ACA-101
  text: Maintain Class 360 for every class (arm) per session with level, arm, stream, capacity, form teacher, language of
    instruction and enrolled learners.
  priority: SHALL
  phase: P1
  module: ACA
- id: FR-ACA-102
  text: Provide the class subject plan with pre-filled mandatory subjects, stream combination rules, periods, teacher of record,
    co-teachers, room type and curriculum version.
  priority: SHALL
  phase: P1
  module: ACA
- id: FR-ACA-103
  text: Validate stream subject combinations against configured examination-body rules (WAEC, NECO, NABTEB).
  priority: SHALL
  phase: P1
  module: ACA
- id: FR-ACA-104
  text: Support sets and cross-class groupings with a parent class link, so a learner's subject teacher is always resolvable.
  priority: SHALL
  phase: P1
  module: ACA
- id: FR-ACA-105
  text: Support the primary class-teacher model with specialist overrides per subject.
  priority: SHALL
  phase: P1
  module: ACA
- id: FR-ACA-106
  text: Copy a class subject plan to other arms of the same level, then allow differences.
  priority: SHALL
  phase: P1
  module: ACA
- id: FR-ACA-107
  text: Roll classes, plans and enrolments to the next session with the Academic Year Rollover Wizard, keeping history.
  priority: SHALL
  phase: P1
  module: ACA
- id: FR-ACA-108
  text: Maintain Department 360 for every academic department with faculty, HOD, subject areas, programmes owned, accreditation,
    lecturers, load policy and facilities.
  priority: SHALL
  phase: P1
  module: ACA
- id: FR-ACA-109
  text: Map each subject area and course to the applicable national benchmark (NUC CCMAS, NBTE, NCCE).
  priority: SHALL
  phase: P1
  module: ACA
- id: FR-ACA-110
  text: Maintain Course 360 per semester with sections, lecturer of record, co-lecturers, teaching assistants, outline, timetable,
    students, LMS space, assessment components and results.
  priority: SHALL
  phase: P1
  module: ACA
- id: FR-ACA-111
  text: Provide course allocation with specialism matching, live load totals against rank limits, service courses and HOD
    approval.
  priority: SHALL
  phase: P1
  module: ACA
- id: FR-ACA-112
  text: Block opening of course registration while any compulsory course in the semester lacks a lecturer of record, unless
    the dean approves an exception.
  priority: SHALL
  phase: P1
  module: ACA
- id: FR-ACA-113
  text: Record lecturer specialisms, ranks, qualifications and professional registrations on Staff 360 and use them in allocation.
  priority: SHALL
  phase: P1
  module: ACA
- id: FR-ACA-114
  text: Record external examiners and moderators per course.
  priority: SHOULD
  phase: P5
  module: ACA
- id: FR-ACA-115
  text: Create LMS course spaces and rosters automatically from published class subject plans and course allocations.
  priority: SHALL
  phase: P2
  module: ACA
- id: FR-ACA-116
  text: Show every teaching professional their complete teaching assignment across institutions (for staff with posts in more
    than one).
  priority: SHALL
  phase: P1
  module: ACA
- id: FR-ACA-117
  text: Report class sizes, teacher–learner ratios and lecturer–student ratios per subject, department, institution and LGA.
  priority: SHALL
  phase: P1
  module: ACA
- id: FR-ACA-118
  text: Keep effective-dated history of every class, department, assignment and allocation so past results always show who
    taught them.
  priority: SHALL
  phase: P1
  module: ACA
- id: FR-ADM-01
  text: Provision and manage tenants with residency, plan and status (provider staff have no learner-data access by default).
  priority: SHALL
  phase: P1
  module: ADM
- id: FR-ADM-02
  text: Maintain versioned country configuration and institution configuration with validation.
  priority: SHALL
  phase: P1
  module: ADM
- id: FR-ADM-03
  text: Manage users, role-at-scope grants, access reviews and automatic deactivation of leavers.
  priority: SHALL
  phase: P1
  module: ADM
- id: FR-ADM-04
  text: Maintain the role and permission matrix; custom roles cannot exceed the creator's clearance.
  priority: SHALL
  phase: P1
  module: ADM
- id: FR-ADM-05
  text: Author, test and publish policy rules and workflow definitions.
  priority: SHALL
  phase: P2
  module: ADM
- id: FR-ADM-06
  text: Provide an integration marketplace and API client/data-sharing agreement management.
  priority: SHALL
  phase: P1
  module: ADM
- id: FR-ADM-07
  text: 'Provide the Data Governance Engine: classification, retention schedules, consent and legal basis, residency, subject
    access and erasure (respecting legal holds), exports and minimisation reviews.'
  priority: SHALL
  phase: P1
  module: ADM
- id: FR-ADM-08
  text: Provide the audit log explorer.
  priority: SHALL
  phase: P1
  module: ADM
- id: FR-ADM-09
  text: Manage platform-level translations, terminology overrides and RTL languages.
  priority: SHALL
  phase: P1
  module: ADM
- id: FR-ADM-10
  text: Manage branding with contrast validation.
  priority: SHALL
  phase: P1
  module: ADM
- id: FR-ADM-101
  text: Provide voice interaction (voice search, voice commands and dictation into forms), captions for video and live classes,
    and alternative formats (large print, easy-read, braille-ready export).
  priority: SHALL
  phase: P2
  module: ADM
- id: FR-ADM-11
  text: Bill the platform itself per learner, institution, module, user, campus, enterprise, government contract, national
    deployment, trust or university-group licence, combinable.
  priority: SHALL
  phase: P1
  module: ADM
- id: FR-ADM-12
  text: Import and migrate legacy data with mapping, validation, master matching, staged commit and 30-day rollback.
  priority: SHALL
  phase: P1
  module: ADM
- id: FR-ADM-13
  text: Show system health, backups and DR readiness to provider staff.
  priority: SHALL
  phase: P1
  module: ADM
- id: FR-AGT-101
  text: Provide an agent runtime that executes agents on events and schedules under scoped service identities bound to a human
    owner.
  priority: SHALL
  phase: P3
  module: AGT
- id: FR-AGT-102
  text: Support autonomy levels A0–A3 with state maximums and institution overrides downward.
  priority: SHALL
  phase: P3
  module: AGT
- id: FR-AGT-103
  text: Hard-code consequential decisions as human-only so no configuration can automate them.
  priority: SHALL
  phase: P3
  module: AGT
- id: FR-AGT-104
  text: Restrict agents to declared, typed tools that call platform commands through the validation, policy and audit pipeline.
  priority: SHALL
  phase: P3
  module: AGT
- id: FR-AGT-105
  text: Ship the 16 agents in 12.2 as configurable templates.
  priority: SHALL
  phase: P3–P7
  module: AGT
- id: FR-AGT-106
  text: Enforce per-agent rate, spend and record limits.
  priority: SHALL
  phase: P3
  module: AGT
- id: FR-AGT-107
  text: Provide instant pause (kill switch) at owner, institution and state level, holding queued actions.
  priority: SHALL
  phase: P3
  module: AGT
- id: FR-AGT-108
  text: Provide 24-hour undo for reversible A2 actions.
  priority: SHALL
  phase: P3
  module: AGT
- id: FR-AGT-109
  text: Record every agent action with trigger, evidence, rule, tool call, outcome and owner; display "Agent X for Owner Y"
    in all histories.
  priority: SHALL
  phase: P3
  module: AGT
- id: FR-AGT-110
  text: Provide sandbox simulation against historical data before activation.
  priority: SHALL
  phase: P3
  module: AGT
- id: FR-AGT-111
  text: Require owner approval, and head-level approval for A2 and above, before activation; quarterly re-approval.
  priority: SHALL
  phase: P3
  module: AGT
- id: FR-AGT-112
  text: Measure agent precision, errors, overrides and complaints; lower autonomy automatically when thresholds are breached.
  priority: SHALL
  phase: P3
  module: AGT
- id: FR-AGT-113
  text: 'Defend against prompt injection: retrieved content is data, never instructions; tool parameters are typed and validated.'
  priority: SHALL
  phase: P3
  module: AGT
- id: FR-AGT-114
  text: Identify automated assistants to families and staff in every conversation and offer hand-over to a person.
  priority: SHALL
  phase: P3
  module: AGT
- id: FR-AGT-115
  text: Register each AI-based agent in the model register (AIX-03) with purpose, data, risks and oversight.
  priority: SHALL
  phase: P3
  module: AGT
- id: FR-ASM-01
  text: Define assessments (formative, summative, coursework, practical, competency, examination) with max mark, weight, date,
    grading scale and the curriculum objectives assessed.
  priority: SHALL
  phase: P1
  module: ASM
- id: FR-ASM-02
  text: 'Provide markbooks per class/subject with validation (hard: ≤ max mark; soft: outliers), missing-work flags and access
    arrangements.'
  priority: SHALL
  phase: P1
  module: ASM
- id: FR-ASM-03
  text: 'Configure grading scales: percentage, letter, grade points, GPA/CGPA, pass/fail, competency levels, degree classifications;
    bands contiguous and non-overlapping.'
  priority: SHALL
  phase: P1
  module: ASM
- id: FR-ASM-04
  text: Support moderation with sampling, moderator marks and tolerance rules.
  priority: SHALL
  phase: P1
  module: ASM
- id: FR-ASM-05
  text: Lock results after approval; corrections require head approval and are audited.
  priority: SHALL
  phase: P1
  module: ASM
- id: FR-ASM-06
  text: Generate report cards from markbooks, attendance, behaviour and comments in branded templates, with completeness checks
    and publication to the parent portal.
  priority: SHALL
  phase: P1
  module: ASM
- id: FR-ASM-07
  text: Never withhold reports for unpaid fees by default; any withholding policy must be explicitly approved and cannot apply
    to learners flagged for SEND or safeguarding.
  priority: SHALL
  phase: P1
  module: ASM
- id: FR-ASM-101
  text: Set target grades automatically from prior attainment and tracking points; show progress against target with red,
    amber and green status and the numeric gap.
  priority: SHALL
  phase: P1
  module: ASM
- id: FR-ASM-102
  text: Import historical and external assessment data for longitudinal tracking and benchmarking against previous cohorts
    and national standards.
  priority: SHALL
  phase: P1
  module: ASM
- id: FR-ASM-103
  text: Let teachers build marksheets with yes/no, numeric, grade, date and comment columns, and export or import them to
    spreadsheets for offline work.
  priority: SHALL
  phase: P1
  module: ASM
- id: FR-ATT-01
  text: Provide daily and lesson registers with country attendance codes, minutes late and notes; ‘all present’ and keyboard
    shortcuts.
  priority: SHALL
  phase: P1
  module: ATT
- id: FR-ATT-02
  text: Pre-fill known absences (parent-reported, trips, exams, exclusions) and show them in the register.
  priority: SHALL
  phase: P1
  module: ATT
- id: FR-ATT-03
  text: Work offline with queued sync and conflict resolution (latest teacher mark wins; office overrides audited).
  priority: SHALL
  phase: P1
  module: ATT
- id: FR-ATT-04
  text: Flag missing registers after a configurable delay and notify the attendance lead.
  priority: SHALL
  phase: P1
  module: ATT
- id: FR-ATT-05
  text: Calculate attendance and punctuality rates by learner, class, year, institution, LGA, state; identify persistent (<
    90%) and severe (< 50%) absence (thresholds configurable).
  priority: SHALL
  phase: P1
  module: ATT
- id: FR-ATT-06
  text: Run first-day absence contact workflow (SMS/call), record reasons, escalate repeated absence; alert DSL for vulnerable
    learners not contacted by the configured time.
  priority: SHALL
  phase: P1
  module: ATT
- id: FR-ATT-07
  text: Trigger the cross-module attendance flow (§20) when thresholds are breached.
  priority: SHALL
  phase: P2
  module: ATT
- id: FR-ATT-08
  text: Record staff attendance where institutions choose (biometric/clock-in integration).
  priority: MAY
  phase: P4
  module: ATT
- id: FR-ATT-101
  text: Send automatic absence notifications to parents on the configured channel after the register closes.
  priority: SHALL
  phase: P1
  module: ATT
- id: FR-ATT-102
  text: Produce emergency and fire-drill registers of everyone on site (learners, staff, visitors) from live attendance, printable
    and on mobile.
  priority: SHALL
  phase: P1
  module: ATT
- id: FR-ATT-103
  text: Accept absence reports from parents by app, WhatsApp and web with reason and attachments; staff acknowledge, accept
    (pre-filling the register code) or query, in a message thread.
  priority: SHALL
  phase: P1
  module: ATT
- id: FR-ATT-104
  text: Show missing and incomplete registers live, nudge the teacher with a direct link at the deadline plus 10 minutes,
    escalate at plus 30 minutes, and report compliance by teacher, institution and LGA.
  priority: SHALL
  phase: P1
  module: ATT
- id: FR-ATT-105
  text: Run evacuation and drill roll calls at assembly points on mobile, offline, from live attendance, staff sign-in and
    visitor log, with real-time unaccounted list, all-clear and drill timing records. Extends FR-ATT-102.
  priority: SHALL
  phase: P1
  module: ATT
- id: FR-ATT-106
  text: Let each institution share attendance with parents live or after a configured delay, in one daily view with behaviour,
    homework and detentions.
  priority: SHOULD
  phase: P1
  module: ATT
- id: FR-BEH-01
  text: Log positive and concern events against the behaviour policy with categories, points, location, description and action.
  priority: SHALL
  phase: P2
  module: BEH
- id: FR-BEH-02
  text: Route bullying events with target learners to the pastoral lead.
  priority: SHALL
  phase: P2
  module: BEH
- id: FR-BEH-03
  text: Analyse patterns by learner, class, period, location, category and link to attendance.
  priority: SHALL
  phase: P2
  module: BEH
- id: FR-BEH-04
  text: Record exclusions/suspensions as head decisions with reason and appeal route; the platform never decides sanctions
    above detention.
  priority: SHALL
  phase: P2
  module: BEH
- id: FR-BEH-101
  text: Provide interactive seating plans per class with drag-and-drop arrangement and one-tap behaviour logging on the plan.
  priority: SHALL
  phase: P2
  module: BEH
- id: FR-BEH-102
  text: Show learner context icons on the seating plan (SEND adjustments, free meals, gifted, target grade) to staff entitled
    to see them.
  priority: SHALL
  phase: P2
  module: BEH
- id: FR-BEH-103
  text: Suggest seating arrangements from behaviour interaction data (who works well together), for the teacher to accept
    or ignore.
  priority: MAY
  phase: P7
  module: BEH
- id: FR-BEH-104
  text: 'Manage detentions: sessions, capacity, location, supervising staff, parent notification and attendance (Attended,
    Pending, Not attended, Escalated).'
  priority: SHALL
  phase: P2
  module: BEH
- id: FR-BEH-105
  text: Trigger configurable event actions (for example 10 negative incidents in 7 days → pastoral review) through the policy
    engine.
  priority: SHALL
  phase: P2
  module: BEH
- id: FR-BEH-106
  text: Configure a versioned behaviour policy per institution (positive and negative behaviours with icon, points, default
    outcome, use in reports and in influences) on top of a state minimum framework; a published version is immutable and later
    versions never re-score past events.
  priority: SHALL
  phase: P2
  module: BEH
- id: FR-BEH-107
  text: Let staff log behaviour for one or several learners in no more than two taps from the register, class list, seating
    plan or mobile app, adding lesson, room and time automatically, online or offline.
  priority: SHALL
  phase: P2
  module: BEH
- id: FR-BEH-108
  text: Award achievement badges at points thresholds or by rule and show them in learner and parent apps and on the student
    report; badges are recognition only and never enter the certificate registry.
  priority: SHOULD
  phase: P2
  module: BEH
- id: FR-BEH-109
  text: Compute pairwise influence scores from behaviour in shared lessons (adjacent versus apart), with a minimum of 20 events,
    the evidence shown for each pair, no protected characteristics, visible only to the class's teachers and pastoral staff.
    Supersedes FR-BEH-103.
  priority: SHALL
  phase: P2
  module: BEH
- id: FR-BEH-110
  text: Provide seating field sets of up to 16 learner data fields per class, subject or level, reusable room layouts, arrangement
    strategies (ability, mixed, alphabetical, random, separate negative influences), a board-safe view for classroom screens
    and logged, watermarked printing for observations.
  priority: SHALL
  phase: P2
  module: BEH
- id: FR-BEH-111
  text: 'Manage a detention ladder: types with duration, room and supervisor; automatic creation from behaviours or intelligence
    events; re-issue at the next level when missed without valid reason; minutes owed; parent notice period and transport
    check for after-school detentions; notification on the parent''s preferred channel.'
  priority: SHALL
  phase: P2
  module: BEH
- id: FR-BEH-112
  text: Provide on-report cards with period, level, owner and personalised targets that appear in every timetabled lesson
    for rating and comment, visible to parents and the learner with comments, and closed with an outcome that can open an
    intervention.
  priority: SHALL
  phase: P2
  module: BEH
- id: FR-BEH-113
  text: Provide an on-call request from any classroom (room, class, teacher, reason) routed to the on-call rota from the timetable,
    with acknowledgement target, escalation, an emergency reason that starts the emergency procedure, and recorded outcome.
  priority: SHALL
  phase: P2
  module: BEH
- id: FR-BEH-114
  text: Provide behaviour analytics with saved report templates, breakdowns by teacher, learner, gender, year, tutor group,
    house, subject, time and location, scheduled delivery, and state roll-up with small-number suppression.
  priority: SHALL
  phase: P2
  module: BEH
- id: FR-BEH-115
  text: Extend intelligence events to attendance, homework and wellbeing data, with actions (notify, message parent, detention,
    on report, intervention, badge, DSL alert), a 30-day simulation before activation, positive milestones, audit and staff
    reversal.
  priority: SHALL
  phase: P2
  module: BEH
- id: FR-BIL-01
  text: 'Support billing bases: per term, semester, annual, monthly, weekly, course, credit, module, session, hour, exam,
    registration, learner, family, service, subscription, pay-as-you-go.'
  priority: SHALL
  phase: P1
  module: BIL
- id: FR-BIL-02
  text: 'Support funding models: government-funded, mixed, scholarships, bursaries, grants, sponsorship, employer-funded,
    loans, instalments.'
  priority: SHALL
  phase: P1
  module: BIL
- id: FR-BIL-03
  text: Define charge types (tuition, registration, exam, accommodation, transport, meals, uniform, books, ICT, laboratory,
    clinical placement, sports, clubs, trips, graduation, certification, professional training, miscellaneous) with ledger
    accounts and tax treatment.
  priority: SHALL
  phase: P1
  module: BIL
- id: FR-BIL-04
  text: Define versioned, effective-dated rules by institution, campus, programme, course, year group, learner category, residency,
    citizenship, scholarship, family, funding source and level; test rules against sample learners before publishing.
  priority: SHALL
  phase: P1
  module: BIL
- id: FR-BIL-05
  text: Reject conflicting rules at the same priority.
  priority: SHALL
  phase: P1
  module: BIL
- id: FR-BIL-06
  text: Run billing runs with preview, exceptions, approval and issue; prevent duplicate invoices per learner per period.
  priority: SHALL
  phase: P1
  module: BIL
- id: FR-BIL-07
  text: Maintain individual learner ledgers and produce consolidated family statements with sibling/family discounts, multiple
    payers, sponsors, split payments and shared invoices.
  priority: SHALL
  phase: P1
  module: BIL
- id: FR-BIL-08
  text: Allow each programme to have a unique billing structure (universities, TVET).
  priority: SHALL
  phase: P5
  module: BIL
- id: FR-BIL-09
  text: Reconcile Government funding + Student payment + Scholarship + Sponsor funding = Total student funding without double
    counting.
  priority: SHALL
  phase: P6
  module: BIL
- id: FR-BIL-10
  text: Offer payment plans and hardship assessment; configure ethical recovery policies; core education restrictions cannot
    be configured.
  priority: SHALL
  phase: P1
  module: BIL
- id: FR-CER-01
  text: 'Evaluate the eligibility chain before issuance: learner identity → institution → programme → curriculum → enrolment
    → attendance/participation → required subjects → assessment → examination → credits/results → progression → qualification
    rules → institutional accreditation at award date → award approval.'
  priority: SHALL
  phase: P2
  module: CER
- id: FR-CER-02
  text: Block issuance when any mandatory check fails; allow progression only through an authorised exception with reason,
    evidence and approver recorded on the certificate.
  priority: SHALL
  phase: P2
  module: CER
- id: FR-CER-03
  text: Run batch eligibility for cohorts/series and route blocked learners to resolution.
  priority: SHALL
  phase: P2
  module: CER
- id: FR-CER-04
  text: Generate certificate numbers (authority sequence + check digit), QR code, verification code, canonical JSON payload,
    SHA-256 hash and digital signature with keys held in KMS/HSM; optionally issue W3C Verifiable Credentials / Open Badges
    3.0.
  priority: SHALL
  phase: P2
  module: CER
- id: FR-CER-05
  text: Never reuse certificate numbers.
  priority: SHALL
  phase: P2
  module: CER
- id: FR-CER-06
  text: Provide a public verification service by number + surname, QR or secure link, with minimum disclosure, rate limiting,
    logging and holder visibility of verifications.
  priority: SHALL
  phase: P2
  module: CER
- id: FR-CER-07
  text: Support bulk verification for registered employers and institutions via API.
  priority: SHOULD
  phase: P2
  module: CER
- id: FR-CER-08
  text: Support correction, replacement, reissue, suspension and revocation with authorised user, reason, date/time, evidence
    and approval; revocation requires two approvers; original records are never deleted.
  priority: SHALL
  phase: P2
  module: CER
- id: FR-CER-09
  text: 'Detect duplicates: certificate number, learner qualification, award, multiple certificates for one qualification,
    issuer not approved.'
  priority: SHALL
  phase: P2
  module: CER
- id: FR-CER-10
  text: 'Raise education integrity alerts for unusual patterns: issuance outside award windows, issuer accreditation expired,
    no matching exam record, obsolete curriculum, unusual grade patterns, duplicate identities, multiple institutions claiming
    one learner.'
  priority: SHALL
  phase: P6
  module: CER
- id: FR-CER-101
  text: Maintain the state certificate registry as the single authoritative register of all certificates issued in the state,
    with status and history.
  priority: SHALL
  phase: P2
  module: CER
- id: FR-CER-102
  text: Publish every issue, reissue, correction and revocation to the registry within 60 seconds and to linked state and
    national platforms and the Education Passport.
  priority: SHALL
  phase: P2
  module: CER
- id: FR-CER-103
  text: Track security-paper stock by serial number from receipt to use, spoilage or destruction; record the stock serial
    on each printed certificate.
  priority: SHALL
  phase: P2
  module: CER
- id: FR-CER-104
  text: Print certificates only on registered security stock through authorised printers; block printing for unsigned or unapproved
    certificates.
  priority: SHALL
  phase: P2
  module: CER
- id: FR-CER-105
  text: Create legacy award records from digitised archives, linked to Learner 360 and marked with their source documents.
  priority: SHALL
  phase: P2
  module: CER
- id: FR-CER-106
  text: Provide an online reissue application for holders, with the reasons and evidence in 11.5.
  priority: SHALL
  phase: P2
  module: CER
- id: FR-CER-107
  text: Verify reissue applicants' identity through NIN verification, OTP and, where enabled, facial match with liveness;
    route mismatches to manual review.
  priority: SHALL
  phase: P2
  module: CER
- id: FR-CER-108
  text: Charge the configured handling fee per certificate type, reason and urgency before processing; support audited waivers.
  priority: SHALL
  phase: P2
  module: CER
- id: FR-CER-109
  text: Issue reissued certificates with new numbers linked to the original, marked "Reissued", and supersede the original
    at the same moment.
  priority: SHALL
  phase: P2
  module: CER
- id: FR-CER-110
  text: Show superseded, corrected and revoked status with date to verifiers, with minimal disclosure.
  priority: SHALL
  phase: P2
  module: CER
- id: FR-CER-111
  text: Record collection or courier delivery of printed certificates with recipient identity.
  priority: SHALL
  phase: P2
  module: CER
