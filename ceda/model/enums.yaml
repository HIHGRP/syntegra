# CEDA fixed enumerations (global core). Each becomes a CHECK constraint, a Django choices list,
# a JSON Schema enum and an OpenAPI enum. Values are stable snake_case codes (≤ 32 chars); the UI shows
# translated labels. Lists that a country, state or institution may change are NOT here — they are
# jurisdiction code lists (model/reference/*.yaml, type cl(...)). Adding a value is an additive change;
# renaming or removing one is a breaking change (CEDA §15).

