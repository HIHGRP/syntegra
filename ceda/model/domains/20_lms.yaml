domain: lms
code: LMS
title: Online coursework — course spaces, content, assignments, submissions, marking, quizzes, live classes and digital skills
module: lms
zone: ops
retention: RS-LMS
summary: >
  A course space for every class-subject and course section, created automatically from published class
  subject plans and approved course allocations, with units generated from the scheme of work and every
  item tagged to curriculum objectives (MFS §8, FR-LMS-101–127). Submissions get hashed, timestamped
  receipts, keep every version and record device and sync times for offline work; work is never
  auto-zeroed. Marks post to the markbook and objective results to curriculum evidence. Digital-skills
  levels for learners and teachers feed the Education Passport and the state dashboard.
  Binary content (files, recordings, H5P packages) is in object storage.

entities:
  course_space:
    title: LMS course space for a class-subject, course section or staff training course (auto-created; roster synced)
    kind: master
    class: internal
    history: lifecycle
    scope: owned
    origin: appj
    reqs: [FR-LMS-101, FR-ACA-115, FR-STF-105, FR-HED-101]
    pages: [LMS-101]
    events: [LMS.SPACE_CREATED]
    attrs:
      - "space_kind: enum(space_kind)!"
      - "class_subject_plan_id: ref(class_subject_plan)"
      - "course_section_id: ref(course_section)"
      - "title: title!"
      - "owner_staff_id: ref(staff)!"
      - "external_lms: json | LTI 1.3 / OneRoster link where an external LMS is used"
      - "storage_bytes: bigint! default=0 | 5 GB per institution per session included"
      - "status: enum(record_status)!"

  course_member:
    title: Roster membership of a course space (synced from enrolment, class membership, registration or allocation)
    kind: link
    class: confidential
    history: effective
    scope: "derived: the course space"
    origin: ceda
    reqs: [FR-LMS-101]
    pages: [LMS-101]
    attrs:
      - "course_space_id: ref(course_space)!"
      - "member_kind: enum(course_member_kind)!"
      - "member_id: uuid! | learner or staff id"
      - "space_role: enum(space_role)!"
    uq: [[course_space_id, member_kind, member_id, valid_from]]

  lms_unit:
    title: Unit (week or topic) of a course space generated from the scheme of work and tagged to objectives
    kind: config
    class: internal
    history: none
    origin: appj
    scope_note: Inherits the course space's scope.
    reqs: [FR-LMS-102]
    pages: [LMS-101]
    attrs:
      - "course_space_id: ref(course_space)!"
      - "title: title!"
      - "sort_order: smallint!"
      - "node_ids: json"
      - "scheme_week_id: ref(scheme_week)"

  lms_content:
    title: Content item — note, file, video, audio, link, H5P interactive or state content-library item
    kind: config
    class: internal
    history: none
    origin: appj
    scope_note: Inherits the unit's scope.
    reqs: [FR-LMS-103, FR-LMS-117]
    pages: [LMS-101]
    attrs:
      - "unit_id: ref(lms_unit)!"
      - "content_kind: enum(content_kind)!"
      - "title: title!"
      - "body: text"
      - "object_key: object_key"
      - "size_bytes: bigint | Data-cost estimate before download"
      - "library_item_id: ref(content_library_item)"
      - "node_ids: json"
      - "is_offline_pack: bool! default=true | Included in the weekly offline download"

  content_library_item:
    title: State content-library resource, curriculum-aligned, published by the state
    kind: master
    zone: registry
    class: public
    history: versioned
    scope: owned
    origin: ceda
    retention: RS-CUR-PERM
    reqs: [FR-LMS-103, FR-OPS-107]
    pages: [LMS-101]
    attrs:
      - "title: title!"
      - "content_kind: enum(content_kind)!"
      - "object_key: object_key"
      - "node_refs: json! | Curriculum versions and objectives"
      - "licence: str(120)"
      - "version: int_u!"
      - "status: enum(version_status)!"

  assignment:
    title: Assignment — homework, coursework, CA test, quiz/CBT, practical, portfolio, peer review or digital-skills task
    kind: transaction
    class: internal
    history: lifecycle
    scope: owned
    origin: appj
    reqs: [FR-LMS-104, FR-LMS-105, FR-LMS-106, FR-LMS-109, FR-LMS-121, FR-LMS-125, FR-LMS-127, FR-CUR-108]
    pages: [LMS-102, LMS-107, LMS-109]
    events: [LMS.ASSIGNMENT_PUBLISHED]
    attrs:
      - "course_space_id: ref(course_space)!"
      - "unit_id: ref(lms_unit)"
      - "assignment_kind: enum(assignment_kind)!"
      - "title: title!"
      - "instructions: text!"
      - "node_ids: json | Objectives assessed"
      - "max_mark: dec(7,3)"
      - "rubric_id: ref(rubric)"
      - "markbook_weight: pct"
      - "assessment_id: ref(assessment) | Markbook column fed on release"
      - "opens_at: ts!"
      - "due_at: ts!"
      - "late_policy: enum(late_policy)! default=accept_flag"
      - "allow_resubmission: bool! default=false"
      - "group_settings: json"
      - "accessibility_options: json"
      - "ai_policy: enum(ai_policy)! default=allowed_with_acknowledgement"
      - "release_at: ts | Scheduled release of marks and feedback"
      - "homework_reason: str(300) | Reason given when the nightly homework limit is exceeded"
      - "status: enum(assignment_status)!"
    ix: [[course_space_id, due_at]]

  rubric:
    title: Marking rubric (criteria and levels; digital-skills rubrics map to the framework)
    kind: config
    class: internal
    history: versioned
    scope: owned
    origin: appj
    retention: RS-CONFIG
    reqs: [FR-LMS-110]
    pages: [LMS-104, LMS-102]
    attrs:
      - "title: title!"
      - "criteria: json! | Criteria, levels, descriptors, points"
      - "framework_ref: code(60) | Digital-skills framework strand"
      - "version: int_u!"

  submission:
    title: Learner submission version (hashed, timestamped receipt; device and sync times; AI-use declaration)
    kind: transaction
    class: confidential
    history: append
    scope: "derived: the assignment's course space"
    origin: appj
    reqs: [FR-LMS-107, FR-LMS-108, FR-LMS-116, FR-LMS-121, FR-LMS-119]
    pages: [LMS-103, LMS-104, LMS-107]
    events: [LMS.SUBMITTED]
    attrs:
      - "assignment_id: ref(assignment)!"
      - "learner_id: ref(learner)!"
      - "group_ref: code(40)"
      - "version_no: smallint!"
      - "is_draft: bool! default=false"
      - "text_body: text"
      - "device_submitted_at: ts | Device clock (offline work)"
      - "synced_at: ts! | Server receipt time"
      - "is_late: bool! | Teacher decides when device and sync times straddle the due time"
      - "receipt_hash: hash! uq"
      - "ai_declaration: enum(ai_declaration)!"
      - "source: enum(submission_source)! | app, web, scan_split (QR cover sheet), ussd_confirmation"
      - "client_op_id: uuid"
    uq: [[assignment_id, learner_id, version_no]]

  submission_file:
    title: File in a submission (compressed on upload; up to 200 MB per submission, configurable)
    kind: event
    class: confidential
    history: append
    origin: appj
    scope_note: Inherits the submission's scope.
    reqs: [FR-LMS-107]
    pages: [LMS-103]
    attrs:
      - "submission_id: ref(submission)!"
      - "object_key: object_key!"
      - "mime_type: mime!"
      - "size_bytes: bigint!"
      - "sha256: hash!"

  submission_mark:
    title: Mark and feedback for a submission (rubric, comments, annotations, audio feedback; auto-marked items)
    kind: transaction
    class: confidential
    history: lifecycle
    origin: appj
    scope_note: Inherits the submission's scope.
    reqs: [FR-LMS-110, FR-LMS-112, FR-LMS-124]
    pages: [LMS-104, LMS-105]
    attrs:
      - "submission_id: ref(submission)! uq"
      - "marker_staff_id: ref(staff)!"
      - "score: dec(7,3)"
      - "rubric_levels: json"
      - "feedback: text"
      - "annotation_object_key: object_key"
      - "audio_feedback_object_key: object_key"
      - "objective_results: json"
      - "is_auto_marked: bool! default=false"
      - "released_at: ts"

  extension:
    title: Individual extension with reason (no lateness flag before the extended date)
    kind: transaction
    class: confidential
    history: lifecycle
    origin: appj
    scope_note: Inherits the assignment's scope.
    reqs: [FR-LMS-109]
    pages: [LMS-104, LMS-107]
    attrs:
      - "assignment_id: ref(assignment)!"
      - "learner_id: ref(learner)!"
      - "new_due_at: ts!"
      - "reason: str(500)!"
      - "granted_by: ref(staff)!"
    uq: [[assignment_id, learner_id]]

  originality_report:
    title: Originality check result from the configured provider (shown to the teacher only; never an automatic penalty)
    kind: event
    class: confidential
    history: append
    origin: ceda
    scope_note: Inherits the submission's scope; teacher only.
    reqs: [FR-LMS-120]
    pages: [LMS-104]
    attrs:
      - "submission_id: ref(submission)!"
      - "provider: code(40)!"
      - "similarity_pct: pct"
      - "report_ref: str(500)"
      - "checked_at: ts!"

  question:
    title: Question-bank item owned by a department or the state (with difficulty and discrimination statistics)
    kind: master
    class: internal
    history: versioned
    scope: owned
    origin: appj
    retention: RS-CUR-PERM
    reqs: [FR-LMS-113]
    pages: [LMS-106]
    attrs:
      - "bank_code: code(40)!"
      - "item_kind: enum(question_kind)!"
      - "stem: text!"
      - "options: json"
      - "answer_key: secret restricted | Encrypted until the test closes"
      - "node_ids: json"
      - "difficulty: ratio"
      - "discrimination: dec(5,3)"
      - "qti_ref: str(200) | QTI 3.0 identifier"
      - "version: int_u!"
      - "status: enum(version_status)!"

  quiz_attempt:
    title: Online quiz or CBT attempt (randomised items, timing incl. extra-time adjustment, secure-mode, IP and device log)
    kind: transaction
    class: confidential
    history: lifecycle
    scope: "derived: the assignment's course space"
    origin: ceda
    reqs: [FR-LMS-113, FR-LMS-106]
    pages: [LMS-106, LMS-103]
    attrs:
      - "assignment_id: ref(assignment)!"
      - "learner_id: ref(learner)!"
      - "item_order: json!"
      - "responses: json"
      - "time_allowed_minutes: minutes! | Includes authorised extra time"
      - "started_at: ts!"
      - "submitted_at: ts"
      - "device_log: json | Secure mode, IP, device"
      - "auto_score: dec(7,3)"
      - "invigilator_staff_id: ref(staff)"

  live_class:
    title: Scheduled live video class (attendance to the register; recording only with consent)
    kind: transaction
    class: internal
    history: lifecycle
    scope: owned
    origin: ceda
    reqs: [FR-LMS-114, FR-ADM-101]
    pages: [LMS-101]
    attrs:
      - "course_space_id: ref(course_space)!"
      - "lesson_occurrence_id: ref(lesson_occurrence)"
      - "starts_at: ts!"
      - "provider_room_ref: str(200)"
      - "recording_object_key: object_key"
      - "recording_consent_complete: bool! default=false"
      - "captions_object_key: object_key"

  discussion_post:
    title: Moderated discussion post (under-13s only in teacher-moderated threads; no private learner-to-learner messages)
    kind: event
    class: confidential
    history: lifecycle
    scope: "derived: the course space"
    origin: ceda
    reqs: [FR-LMS-115]
    pages: [LMS-101]
    attrs:
      - "course_space_id: ref(course_space)!"
      - "thread_ref: uuid!"
      - "author_kind: enum(course_member_kind)!"
      - "author_id: uuid!"
      - "body: text!"
      - "moderation: enum(moderation_state)!"
      - "posted_at: ts!"

  homework_limit:
    title: Nightly homework timetable and load limit for a class
    kind: config
    class: internal
    history: effective
    origin: appj
    retention: RS-CONFIG
    scope_note: Inherits the class's scope.
    reqs: [FR-LMS-127]
    pages: [LMS-109]
    attrs:
      - "class_group_id: ref(class_group)!"
      - "weekday: smallint!"
      - "max_items: smallint!"
      - "subject_slots: json | Subjects expected that night"
    uq: [[class_group_id, weekday, valid_from]]

  digital_skill_level:
    title: Digital-skills level per person and strand (device use, information literacy, communication, content creation, safety, computational thinking)
    kind: transaction
    class: confidential
    history: effective
    scope: "derived: the person's institution"
    origin: appj
    retention: RS-LRN-PERM
    reqs: [FR-LMS-122, FR-LMS-123, FR-LMS-126]
    pages: [LMS-108, LRN-06]
    attrs:
      - "person_kind: enum(person_kind)!"
      - "person_id: uuid!"
      - "strand: cl(digital_strand)!"
      - "level: smallint!"
      - "evidence: json | LMS activity evidence"
    uq: [[person_kind, person_id, strand, valid_from]]
    checks:
      level_range: "level BETWEEN 1 AND 5"

  ussd_session:
    title: USSD/SMS feature-phone interaction (due dates, completion confirmation)
    kind: event
    class: confidential
    history: append
    origin: ceda
    retention: RS-OPS-3
    scope_note: Linked to the learner's institution.
    reqs: [FR-LMS-118]
    pages: [LMS-107]
    attrs:
      - "learner_id: ref(learner)"
      - "msisdn_hmac: hmac!"
      - "action: enum(ussd_action)!"
      - "assignment_id: ref(assignment)"
      - "occurred_at: ts!"
