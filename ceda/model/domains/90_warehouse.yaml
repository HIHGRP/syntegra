domain: warehouse
code: DW
title: Analytics warehouse — conformed dimensions, facts, aggregates, live KPI read model and feature store
module: analytics
zone: dw
summary: >
  A separate MySQL 9.7 analytics cluster per state fed by CDC (Debezium → Kafka → loaders) so analytical
  queries never run on the operational primary (NFR-PLAT-110, FR-RPT-06). Layers: raw (CDC landing,
  not modelled here) → conformed core (the dimensions and facts below, Kimball style, SCD type 2 where
  history matters) → aggregates (agg_*) and the live KPI read model → semantic layer (metrics.yaml).
  Learner and staff keys are pseudonymised with a keyed HMAC at load; re-identification happens only
  through the operational API under the user's permissions. The vault is never replicated: safeguarding,
  SEND and wellbeing appear only as governed counts. Surrogate keys are BIGINT; every table carries
  tenant_id (the state), loaded_at and load_batch_id.

entities:
  dim_date:
    title: Calendar date dimension
    kind: dimension
    class: public
    history: none
    origin: ceda
    pk: [tenant_id, date_key]
    sources: [academic_period, calendar_event]
    attrs:
      - "date_key: int! | YYYYMMDD"
      - "calendar_date: date!"
      - "day_of_week: smallint!"
      - "iso_week: smallint!"
      - "month_no: smallint!"
      - "year_no: smallint!"
      - "is_weekend: bool!"
      - "state_session_label: code(20)"
      - "state_term_label: code(20)"
      - "is_state_school_day: bool!"

  dim_scope:
