    sources: [scope_node]
    attrs:
      - "scope_key: bigint!"
      - "scope_node_id: uuid!"
      - "level: enum(scope_level)!"
      - "code: code(40)!"
      - "name: title!"
      - "path: path!"
      - "state_code: subdivision"
      - "lga_code: code(40)"
      - "ownership: cl(ownership)"
      - "row_valid_from: date!"
      - "row_valid_to: date"
      - "is_current: bool!"
    ix: [[scope_node_id, is_current], [path]]

  dim_scope_closure:
