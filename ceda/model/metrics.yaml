# CEDA semantic layer — every official indicator defined once (MFS §7.3, Book 3 §28.1, FR-RPT-02/04).
# Dashboards (CMD-*), returns, briefings, report builder, BI connector and the assistant all read these
# definitions; none computes its own. Each metric names its warehouse sources, grain, dimensions, refresh,
# direction, the pages that show it and the requirements it serves.
#
# Rules applied by the semantic-layer service to every metric:
#  - permission trimming by scope subtree (dim_scope_closure) and clearance;
#  - small-number suppression: any cell with fewer than 10 learners/persons outside the institution scope
#    is shown as "< 10" and excluded from drill-down (FR-CMD-108, FR-CMD-10);
#  - context before comparison: rankings only within dim_institution.comparison_group (P7, FR-CMD-109);
#  - each value carries label_kind (verified | calculated | estimated), as_of, freshness and lineage
#    (metric → facts → CEDA entities), shown on every tile (FR-RPT-04, MFS §14.4 rule 6);
#  - equity/gender breakdowns only where jurisdiction policy allows (FR-CMD-113).

metrics:
  # ---------------------------------------------------------------- Access
  - {id: ENR-COUNT, group: Access, name: Learners enrolled, formula: "count of active primary enrolments", grain: day × institution × level × sex, refresh: daily, direction: target_band, sources: [agg_enrolment_daily, enrolment], pages: [CMD-101, CMD-02, CMD-03, CMD-04, CMD-05, CMD-06, CMD-07, ATT-02], reqs: [FR-CMD-105, FR-CMD-114, FR-CMD-01]}
  - {id: ENR-GER, group: Access, name: Gross enrolment ratio, formula: "enrolled at level ÷ population of official age for level (population projections)", grain: year × state/LGA × level × sex, refresh: termly, direction: higher_is_better, label: estimated, sources: [agg_enrolment_daily], pages: [CMD-02, CMD-03, CMD-01], reqs: [FR-CMD-113]}
  - {id: ENR-NER, group: Access, name: Net enrolment ratio, formula: "enrolled of official age at level ÷ population of official age", grain: year × state/LGA × level × sex, refresh: termly, direction: higher_is_better, label: estimated, sources: [agg_enrolment_daily, dim_learner], pages: [CMD-02, CMD-03], reqs: [FR-CMD-113]}
  - {id: ENR-OOSC, group: Access, name: Out-of-school estimate, formula: "population of compulsory age − enrolled of compulsory age", grain: year × LGA, refresh: termly, direction: lower_is_better, label: estimated, sources: [agg_enrolment_daily, cme_referral], pages: [CMD-03, CMD-04], reqs: [FR-CMD-113]}
  - {id: ENR-TRANSITION, group: Access, name: Transition rate (primary → JSS → SSS → tertiary), formula: "learners enrolled at next stage in session t+1 ÷ learners completing stage in session t", grain: session × LGA × stage, refresh: termly, direction: higher_is_better, sources: [fact_enrolment_census, enrolment], pages: [CMD-02, CMD-03], reqs: [FR-CMD-113]}
  - {id: INS-LIVE, group: Access, name: Institutions live, formula: "institutions with onboarding_status = live ÷ institutions on the register", grain: day × LGA × ownership, refresh: daily, direction: higher_is_better, sources: [dim_institution, institution, onboarding_check], pages: [CMD-101, CMD-103], reqs: [FR-CMD-101, FR-CMD-102, FR-CMD-105]}

  # ---------------------------------------------------------------- Participation
  - {id: ATT-RATE, group: Participation, name: Learner attendance rate, formula: "present sessions (incl. late) ÷ possible sessions", grain: day × class/institution/LGA/state, refresh: live_15min, direction: higher_is_better, target: 0.95, sources: [live_kpi, agg_attendance_daily, attendance_mark], pages: [CMD-101, CMD-02, CMD-03, CMD-04, CMD-05, CMD-06, ATT-02, CMD-07], reqs: [FR-ATT-05, FR-CMD-112, FR-CMD-105]}
  - {id: ATT-PERSISTENT, group: Participation, name: Persistent absence rate, formula: "learners with term attendance < 90% ÷ learners", grain: term × institution × level, refresh: daily, direction: lower_is_better, sources: [agg_learner_attendance_term], pages: [ATT-02, CMD-06, CMD-04], reqs: [FR-ATT-05]}
  - {id: ATT-SEVERE, group: Participation, name: Severe absence rate, formula: "learners with term attendance < 50% ÷ learners", grain: term × institution × level, refresh: daily, direction: lower_is_better, sources: [agg_learner_attendance_term], pages: [ATT-02, CMD-06], reqs: [FR-ATT-05]}
  - {id: ATT-DROPOUT, group: Participation, name: Dropout rate, formula: "enrolments ended with leaving_reason dropped_out or unknown destination at compulsory age ÷ enrolled", grain: term × institution × level × sex, refresh: daily, direction: lower_is_better, sources: [agg_enrolment_daily, enrolment], pages: [CMD-03, CMD-06], reqs: [FR-CMD-113]}
  - {id: REG-COMPLIANCE, group: Participation, name: Register compliance, formula: "registers submitted by deadline ÷ registers due", grain: day × teacher/institution/LGA, refresh: live_15min, direction: higher_is_better, sources: [agg_attendance_daily, attendance_register], pages: [ATT-102, CMD-04, CMD-101], reqs: [FR-ATT-104, FR-CMD-112]}
  - {id: STF-PRESENCE, group: Participation, name: Teachers present today, formula: "staff present ÷ staff expected", grain: day × institution/LGA/state, refresh: live_15min, direction: higher_is_better, sources: [live_kpi, fact_staff_presence], pages: [CMD-101, CMD-04, CMD-06], reqs: [FR-CMD-112, FR-ATT-08]}

  # ---------------------------------------------------------------- Teaching
  - {id: CUR-COVERAGE, group: Teaching, name: Curriculum coverage (qualified teacher of record), formula: "mandatory class-subjects with a qualified teacher of record ÷ mandatory class-subjects", grain: day × class/institution/LGA/state × subject × level, refresh: daily, direction: higher_is_better, target: 0.98, sources: [fact_class_subject_coverage], pages: [CUR-101, CMD-101, CMD-03, CUR-07], reqs: [FR-CUR-113, FR-CMD-105, FR-CUR-13]}
  - {id: CUR-HOURS, group: Teaching, name: Teaching-hours coverage, formula: "Σ min(1, delivered hours ÷ pro-rata required hours to date) averaged over class-subjects", grain: day × class/institution × subject, refresh: daily, direction: higher_is_better, sources: [fact_class_subject_coverage, fact_curriculum_delivery], pages: [CUR-101, CUR-06], reqs: [FR-CUR-09]}
  - {id: CUR-COMPLIANCE, group: Teaching, name: Curriculum compliance score, formula: "0.20·subject coverage + 0.25·teaching hours + 0.25·objectives delivered + 0.15·assessment coverage + 0.15·qualified staff (authority-configurable, versioned); bands ≥95 compliant, 80–94.9 partial, <80 non-compliant, insufficient data = not assessed", grain: day × institution, refresh: daily, direction: higher_is_better, sources: [fact_compliance_score, fact_class_subject_coverage], pages: [CUR-06, CUR-07, INS-02, CMD-06], reqs: [FR-CUR-09, FR-CUR-10, FR-CUR-13]}
  - {id: CUR-GAPS-OPEN, group: Teaching, name: Open coverage gaps by severity and age, formula: "count of open gaps; age = today − opened date", grain: day × institution/LGA × rule × severity, refresh: daily, direction: lower_is_better, sources: [fact_coverage_gap], pages: [CUR-101, CUR-103, CMD-101, CMD-04], reqs: [FR-CUR-113, FR-CMD-105]}
  - {id: STF-QUALIFIED-RATE, group: Teaching, name: Qualified teacher rate, formula: "teachers with valid qualification and TRCN registration ÷ teachers", grain: day × institution/LGA × subject, refresh: daily, direction: higher_is_better, sources: [dim_staff, staff_qualification], pages: [STF-08, CMD-03, CMD-02], reqs: [FR-CMD-113]}
  - {id: PTR, group: Teaching, name: Teacher–learner ratio, formula: "enrolled learners ÷ teaching FTE (by subject using class-subject assignments)", grain: day × institution/LGA × subject × level, refresh: daily, direction: target_band, sources: [agg_enrolment_daily, staff_post, teaching_assignment], pages: [CMD-101, CMD-02, ACA-102, STF-10], reqs: [FR-ACA-117]}
  - {id: TCH-DEMAND-SUPPLY, group: Teaching, name: Teacher demand vs supply, formula: "demand = Σ curriculum hours × classes ÷ max load; supply = authorised teaching capacity; gap = demand − supply", grain: term × LGA × subject × level, refresh: daily, direction: lower_is_better, sources: [fact_class_subject_coverage, staff_qualification, staff_post], pages: [STF-10, CMD-13, CMD-14], reqs: [FR-CUR-112, FR-STF-10]}
  - {id: CPD-COMPLIANCE, group: Teaching, name: CPD and statutory training compliance, formula: "adults with valid mandatory training ÷ adults required", grain: day × institution/LGA/state × course, refresh: daily, direction: higher_is_better, sources: [training_completion, cpd_record], pages: [STF-101, STF-07], reqs: [FR-STF-07, FR-STF-105]}

  # ---------------------------------------------------------------- Learning
  - {id: CA-AVERAGE, group: Learning, name: Continuous assessment average, formula: "mean score % of locked CA assessments", grain: term × class/institution × subject, refresh: termly, direction: higher_is_better, sources: [fact_assessment_result], pages: [CMD-06, CMD-03], reqs: [FR-CMD-114]}
  - {id: EXAM-5CREDITS, group: Learning, name: Exam pass rate (5 credits incl. English and Mathematics), formula: "candidates with ≥ 5 credits including English and Mathematics ÷ candidates sitting", grain: series × institution/LGA/state × sex, refresh: per_series, direction: higher_is_better, sources: [fact_exam_result], pages: [CMD-101, CMD-02, CMD-03, CMD-06, CMD-102], reqs: [FR-CMD-114]}
  - {id: PROGRESS-TARGET, group: Learning, name: Progress against target, formula: "learners at or above target grade ÷ learners with targets", grain: term × class/institution × subject, refresh: termly, direction: higher_is_better, sources: [fact_assessment_result, target_grade], pages: [ASM-01, CMD-06], reqs: [FR-ASM-101]}
  - {id: LMS-COMPLETION, group: Learning, name: Assignment completion rate, formula: "submissions on time or late ÷ expected submissions", grain: week × class/institution/LGA, refresh: daily, direction: higher_is_better, sources: [fact_lms_activity], pages: [LMS-108, CMD-101], reqs: [FR-LMS-126]}
  - {id: LMS-ADOPTION, group: Learning, name: Digital adoption, formula: "active course spaces; assignments set per teacher per month; teachers setting ≥ 1 online assignment per month ÷ teachers", grain: month × institution/LGA, refresh: daily, direction: higher_is_better, sources: [fact_lms_activity, course_space], pages: [LMS-108, CMD-101], reqs: [FR-LMS-126]}
  - {id: DIGITAL-SKILLS, group: Learning, name: Digital skills attainment, formula: "distribution of learners and teachers by level (1–5) per strand", grain: term × institution/LGA × strand, refresh: termly, direction: higher_is_better, sources: [fact_digital_skill], pages: [LMS-108], reqs: [FR-LMS-122]}

  # ---------------------------------------------------------------- Wellbeing and safety (counts only above institution)
  - {id: SAF-CONCERNS, group: Wellbeing and safety, name: Safeguarding concerns (counts only), formula: "count of concerns by category; groups < 10 suppressed above institution", grain: day × institution/LGA × category, refresh: daily, direction: target_band, sources: [agg_wellbeing_safeguarding_count], pages: [SAF-103, CMD-101], reqs: [FR-SAF-106]}
  - {id: BEH-RATIO, group: Wellbeing and safety, name: Positive-to-negative behaviour ratio, formula: "positive events ÷ negative events", grain: week × institution/LGA × type, refresh: daily, direction: higher_is_better, sources: [fact_behaviour], pages: [BEH-02, CMD-101], reqs: [FR-BEH-114]}
  - {id: SEND-COVERAGE, group: Wellbeing and safety, name: SEND provision coverage, formula: "learners on the SEND register with allocated provision ÷ learners on the register", grain: term × institution/LGA, refresh: daily, direction: higher_is_better, sources: [agg_wellbeing_safeguarding_count], pages: [SEN-04, CMD-101], reqs: [FR-SEN-07]}
  - {id: FACILITY-INCIDENTS, group: Wellbeing and safety, name: Facility safety incidents, formula: "count by severity", grain: month × institution/LGA, refresh: daily, direction: lower_is_better, sources: [facility_incident], pages: [OPS-03, CMD-101], reqs: [FR-OPS-103]}

  # ---------------------------------------------------------------- Infrastructure
  - {id: INFRA-CLASSROOM, group: Infrastructure, name: Learners per classroom, formula: "enrolled ÷ classrooms in use", grain: term × institution/LGA, refresh: termly, direction: lower_is_better, sources: [fact_infrastructure], pages: [CMD-101, CMD-13, OPS-01], reqs: [FR-OPS-01, FR-CMD-114]}
  - {id: INFRA-TEXTBOOK, group: Infrastructure, name: Textbook-to-learner ratio, formula: "textbooks issued for subject and level ÷ learners at level", grain: term × institution/LGA × subject × level, refresh: termly, direction: higher_is_better, sources: [fact_infrastructure, resource_issue], pages: [OPS-08, CMD-13], reqs: [FR-OPS-107]}
  - {id: INFRA-BASICS, group: Infrastructure, name: Water, power, toilets and ICT access, formula: "share of institutions with each facility; toilets per learner by sex", grain: term × LGA, refresh: termly, direction: higher_is_better, sources: [fact_infrastructure], pages: [CMD-101, CMD-03], reqs: [FR-CMD-114]}

  # ---------------------------------------------------------------- Finance
  - {id: CAPITATION-RECON, group: Finance, name: Capitation received vs due, formula: "capitation received ÷ due", grain: tranche × institution/LGA, refresh: monthly, direction: higher_is_better, sources: [government_funding_receipt], pages: [BIL-08, CMD-101], reqs: [FR-BIL-09]}
  - {id: FEE-COLLECTION, group: Finance, name: Fee collection rate (private), formula: "collected ÷ invoiced", grain: month × institution, refresh: daily, direction: higher_is_better, sources: [fact_finance], pages: [BIL-05, CMD-06], reqs: [FR-CMD-114]}
  - {id: BUDGET-EXECUTION, group: Finance, name: Budget execution, formula: "actual ÷ budget by cost centre", grain: month × institution × cost centre, refresh: daily, direction: target_band, sources: [fact_finance, budget], pages: [FIN-02], reqs: [FR-FIN-02]}
  - {id: FEEDING-RECON, group: Finance, name: School feeding reconciliation, formula: "meals served ÷ learners present", grain: day × institution, refresh: daily, direction: target_band, sources: [meal_service, agg_attendance_daily], pages: [OPS-07, CMD-101], reqs: [FR-OPS-07]}
  - {id: SDAF-COLLECTION, group: Finance, name: SDAF billed, collected, remitted, outstanding and collection rate, formula: "collection rate = collected ÷ (billed − exempted); outstanding = billed − exempted − collected; remittance variance = collected − remitted (aged)", grain: billing period × institution/LGA/institution type, refresh: daily, direction: higher_is_better, sources: [fact_sdaf], pages: [SUB-105, SUB-103, SUB-104], reqs: [FR-SUB-115, FR-SUB-112]}

  # ---------------------------------------------------------------- Integrity and data
  - {id: DQI, group: Integrity and data, name: Data Quality Index, formula: "0.30·Completeness + 0.20·Uniqueness + 0.20·Validity + 0.15·Timeliness + 0.10·Consistency + 0.05·Verification (0–100)", grain: day × institution/LGA/state, refresh: daily, direction: higher_is_better, sources: [fact_data_quality], pages: [CMD-16, CMD-101, INS-02], reqs: [FR-CMD-104]}
  - {id: DUP-RATE, group: Integrity and data, name: Duplicate learner rate, formula: "open probable duplicates ÷ learners", grain: day × institution/LGA, refresh: daily, direction: lower_is_better, target: 0.005, sources: [match_review, fact_data_quality], pages: [CMD-16, ADM-17], reqs: [FR-CMD-104]}
  - {id: CERT-INTEGRITY, group: Integrity and data, name: Certificate verifications and integrity alerts, formula: "verifications by result; open integrity alerts", grain: day × state/issuer, refresh: daily, direction: lower_is_better, sources: [fact_certificate_event, alert], pages: [CMD-15, CMD-101], reqs: [FR-CER-10]}
  - {id: DIGITISATION, group: Integrity and data, name: Digitisation progress and quality, formula: "pages captured, indexed and searchable; key-field accuracy; hours scan-to-searchable", grain: day × hub/LGA, refresh: daily, direction: higher_is_better, sources: [fact_digitisation], pages: [DOC-101, CMD-101], reqs: [FR-DOC-118]}
  - {id: DATA-FRESHNESS, group: Integrity and data, name: Data freshness, formula: "institutions with stale datasets ÷ institutions live", grain: day × LGA × dataset, refresh: live_15min, direction: lower_is_better, sources: [dataset_freshness], pages: [CMD-101, CMD-103], reqs: [FR-CMD-104]}

  # ---------------------------------------------------------------- Engagement
  - {id: PARENT-APP, group: Engagement, name: Parent app adoption, formula: "guardians with an active parent account ÷ guardians", grain: week × institution/LGA, refresh: weekly, direction: higher_is_better, sources: [app_user, guardian], pages: [CMD-101], reqs: [FR-CMD-114]}
  - {id: MSG-DELIVERY, group: Engagement, name: Messages delivered, read rate, response time and cost, formula: "delivered ÷ sent; read ÷ delivered; median first response minutes; Σ cost", grain: day × institution × channel, refresh: daily, direction: higher_is_better, sources: [fact_message], pages: [COM-02, COM-103, CMD-101], reqs: [FR-COM-117]}
  - {id: PTM-ATTENDANCE, group: Engagement, name: Parents' meeting attendance, formula: "attended bookings ÷ learners invited", grain: event × institution, refresh: weekly, direction: higher_is_better, sources: [meeting_booking], pages: [PTM-101, CMD-101], reqs: [FR-PTM-104]}

  # ---------------------------------------------------------------- Composite and global
  - {id: HEALTH-INDEX, group: Composite, name: Institution health index, formula: "Σ wᵢ·sᵢ ÷ Σ wᵢ over available indicators (0–100, normalised to policy targets); missing indicators excluded and weights renormalised (tile shows 'partial'); bands ≥80 strong, 65–79 adequate, 50–64 concern, <50 critical", grain: day × institution (rolled up by enrolment-weighted mean), refresh: daily, direction: higher_is_better, sources: [fact_health_index], pages: [INS-05, CMD-06, CMD-101, CMD-02, CMD-03, CMD-04, CMD-05, CMD-102, CMD-11, CMD-12], reqs: [FR-CMD-01, FR-CMD-02, FR-CMD-06, FR-CMD-109, FR-CMD-09]}
  - {id: INST-PERFORMANCE, group: Composite, name: Institution performance table, formula: "per institution in scope: level, ownership, enrolment, attendance, health index, curriculum coverage, exam results, PTR, data freshness — sortable, filterable, saved views, export", grain: day × institution, refresh: daily, direction: target_band, sources: [agg_metric, dim_institution], pages: [CMD-101, CMD-102, CMD-11], reqs: [FR-CMD-106, FR-CMD-105, FR-CMD-108]}
  - {id: GLOBAL-INDICATORS, group: Composite, name: Global and national indicators (from state aggregates only), formula: "country and global aggregates computed from in-country state aggregates; each labelled verified, calculated or estimated", grain: year × country/state, refresh: termly, direction: target_band, sources: [agg_metric], pages: [CMD-01, CMD-02], reqs: [FR-CMD-10, FR-CMD-01, FR-RPT-06]}
  - {id: NETWORK-SUMMARY, group: Composite, name: Network dashboard summary, formula: "member-institution aggregates of ENR-COUNT, ATT-RATE, HEALTH-INDEX, EXAM-5CREDITS, FEE-COLLECTION", grain: day × network, refresh: daily, direction: target_band, sources: [agg_metric], pages: [CMD-05], reqs: [FR-CMD-01]}
  - {id: LGA-TODAY, group: Composite, name: LGA today — attendance, cover gaps, maintenance, missing registers, refreshed ≤ 15 min, formula: "live attendance, open cover gaps (G8), critical maintenance, registers missing", grain: day × LGA × institution, refresh: live_15min, direction: target_band, sources: [live_kpi, coverage_gap, maintenance_request], pages: [CMD-04], reqs: [FR-CMD-112]}

  # ---------------------------------------------------------------- Human resources (CR-001)
  - {id: HR-ESTAB-FILL, group: Human resources, name: Establishment fill rate, formula: "approved positions filled by an active employment record ÷ approved positions", grain: day × institution/LGA/employer × cadre, refresh: daily, direction: higher_is_better, sources: [position, employment_record], pages: [HRM-10, HRM-01], reqs: [FR-HRM-15, FR-HRM-01]}
  - {id: HR-VACANCIES, group: Human resources, name: Vacant positions by subject, formula: "approved funded positions without an active employment record, by subject specialism", grain: day × institution/LGA × subject, refresh: daily, direction: lower_is_better, sources: [position, employment_record], pages: [HRM-10, HRM-01, STF-10], reqs: [FR-HRM-15]}
  - {id: HR-ATTRITION, group: Human resources, name: Staff attrition, formula: "separations in the last 12 months ÷ average active posts", grain: month × employer/LGA × cadre × separation kind, refresh: daily, direction: lower_is_better, sources: [separation, employment_record], pages: [HRM-10], reqs: [FR-HRM-15]}
  - {id: HR-RETIRE-12M, group: Human resources, name: Retirements due in 12 months, formula: "active employment records with retirement_due_on within 12 months", grain: month × employer/LGA × subject, refresh: daily, direction: target_band, sources: [employment_record], pages: [HRM-10, HRM-02], reqs: [FR-HRM-15, FR-HRM-03]}
  - {id: HR-LEAVE-LIABILITY, group: Human resources, name: Leave liability, formula: "Σ (entitled + carried over − taken) annual-leave days across staff", grain: leave year × employer × institution, refresh: daily, direction: target_band, sources: [leave_balance], pages: [HRM-10, HRM-04], reqs: [FR-HRM-15]}
  - {id: HR-INTEGRITY-OPEN, group: Human resources, name: Open payroll integrity flags, formula: "open flags by kind; pay held by decision", grain: day × employer × flag kind, refresh: daily, direction: lower_is_better, sources: [hr_integrity_flag], pages: [HRM-08, HRM-10], reqs: [FR-HRM-12, FR-HRM-15]}

  # ---------------------------------------------------------------- Fee clearance (CR-001)
  - {id: FCL-OUTSTANDING-RATE, group: Finance, name: Incoming learners with outstanding obligations, formula: "clearance checks with result outstanding ÷ clearance checks", grain: month × LGA × institution type, refresh: daily, direction: lower_is_better, sources: [clearance_check], pages: [FCL-01, FCL-02, FCL-03], reqs: [FR-FCL-02, FR-FCL-08]}
  - {id: FCL-DISPUTE-UPHELD, group: Finance, name: Obligation disputes upheld, formula: "disputes upheld or partly upheld ÷ disputes resolved, by creditor institution (unsupported claims)", grain: term × creditor institution, refresh: daily, direction: lower_is_better, sources: [obligation_dispute], pages: [FCL-03], reqs: [FR-FCL-06]}
  - {id: FCL-NATIONAL-COVERAGE, group: Finance, name: National clearance coverage, formula: "states that answered ÷ 37 (36 states and the FCT) per clearance check; states on the network ÷ 37", grain: day × requesting state, refresh: daily, direction: higher_is_better, sources: [clearance_exchange_query, exchange_peer], pages: [FCL-04], reqs: [FR-FCL-10, FR-FCL-13]}
  - {id: STI-INTAKE-FILL, group: Security training, name: Course intake fill rate, formula: "trainees on intake ÷ intake capacity", grain: intake × course × institution × agency, refresh: daily, direction: higher_is_better, sources: [trainee_record, security_course_intake], pages: [STI-03, STI-04], reqs: [FR-STI-07]}
  - {id: STI-PASS-OUT-RATE, group: Security training, name: Trainee pass-out rate, formula: "trainees passed out or commissioned ÷ trainees with a final outcome", grain: intake × course × institution × agency, refresh: daily, direction: higher_is_better, sources: [trainee_record], pages: [STI-02, STI-04], reqs: [FR-STI-07]}
  - {id: REG-PROFILE-COMPLETE, group: Regulation, name: Institutions with a complete regulatory profile, formula: "institutions with a supervising body, an accreditor where required and an examination body for examined levels ÷ institutions", grain: registry × category × ownership, refresh: daily, direction: higher_is_better, sources: [institution_regulation, institution], pages: [REG-02, FED-01], reqs: [FR-REG-04]}

  # ---------------------------------------------------------------- CR-006: accounting and budgets, funding, infrastructure
  - {id: ACC-BUDGET-EXECUTION, group: Finance, name: Budget execution rate, formula: "actual ÷ revised budget, and (actual + committed) ÷ revised budget", grain: fiscal year × institution × cost centre × economic code, refresh: daily, direction: neutral, sources: [fact_budget_execution], pages: [FIN-02], reqs: [FR-ACC-06]}
  - {id: ACC-IMPREST-OVERDUE, group: Finance, name: Overdue imprest, formula: "imprest not retired by its due date ÷ imprest issued", grain: month × institution, refresh: daily, direction: lower_is_better, sources: [imprest], pages: [ACC-01], reqs: [FR-ACC-05]}
  - {id: FND-DISBURSED, group: Funding, name: Funding disbursed, formula: "sum of disbursements by programme and beneficiary kind", grain: month × institution × programme, refresh: daily, direction: neutral, sources: [fact_funding], pages: [FND-01], reqs: [FR-IDW-04]}
  - {id: FND-ARREARS-RATE, group: Funding, name: Loans in arrears, formula: "agreements in arrears ÷ agreements repaying or in arrears", grain: month × programme × institution, refresh: daily, direction: lower_is_better, sources: [fact_funding], pages: [FND-01], reqs: [FR-FND-05]}
  - {id: EST-USABLE-CLASSROOMS, group: Infrastructure, name: Usable classrooms, formula: "classrooms whose latest assessment is fully usable or usable with repairs ÷ classrooms", grain: day × institution/LGA/state, refresh: daily, direction: higher_is_better, sources: [agg_infrastructure_scope], pages: [EST-03, OPS-01], reqs: [FR-IDW-02]}
  - {id: EST-LEARNERS-PER-USABLE-CLASSROOM, group: Infrastructure, name: Learners per usable classroom, formula: "enrolled learners ÷ usable classrooms", grain: day × institution/LGA/state, refresh: daily, direction: lower_is_better, sources: [agg_infrastructure_scope], pages: [EST-03], reqs: [FR-IDW-02]}
  - {id: EST-UNSAFE-IN-USE, group: Infrastructure, name: Unsafe facilities still in use, formula: "facilities assessed unsafe, unusable or condemned and recorded in use", grain: day × institution/LGA/state, refresh: daily, direction: lower_is_better, sources: [agg_infrastructure_scope], pages: [EST-02, EST-03], reqs: [FR-EST-04, FR-IDW-02]}
  - {id: EST-ACTIONS-ON-TIME, group: Infrastructure, name: Facility actions on time, formula: "facility actions done by their due date ÷ facility actions due", grain: month × institution/LGA, refresh: daily, direction: higher_is_better, sources: [facility_action], pages: [EST-02, EST-03], reqs: [FR-EST-04]}
  - {id: EST-REPAIR-BACKLOG, group: Infrastructure, name: Repair backlog, formula: "sum of the latest repair estimates of facilities not fully usable", grain: day × institution/LGA/state, refresh: daily, direction: lower_is_better, sources: [agg_infrastructure_scope], pages: [EST-03], reqs: [FR-IDW-02]}
