  PLT.TENANT_PROVISIONED: {producer: platform, aggregate: tenant, payload: {tenant_id: uuid!, kind: enum(tenant_kind)!, parent_id: uuid}, consumers: [governance, iam, analytics, comms], trigger: "A tenant (state, private provider, network) is provisioned"}
