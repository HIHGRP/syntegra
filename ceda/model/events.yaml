  WF.COMPLETED: {producer: governance, aggregate: workflow_instance, payload: {workflow_instance_id: uuid!, state: code(60)!}, consumers: [subject_module], trigger: Workflow reached a terminal state}
  WF.TASK_ASSIGNED: {producer: governance, aggregate: workflow_task, payload: {workflow_task_id: uuid!, assignee_user_id: uuid, due_at: ts}, consumers: [comms], trigger: Human task created or reassigned}
