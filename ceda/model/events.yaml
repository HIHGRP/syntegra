# CEDA domain-event catalogue (MFS Book 3 §16). Events are named <DOMAIN>.<PAST_TENSE_VERB>, written to
# the producing zone's outbox in the same transaction as the change, published by Debezium to Kafka topic
# syn.<region>.<domain>.v<major> keyed by aggregate id, and carried in the CloudEvents envelope
# (generated/events/envelope.schema.json). Payloads hold identifiers and minimal non-personal facts only;
# consumers fetch details through the API under their own permissions. Special-category events carry no
# detail at all (SAF.*). 'version' is the payload schema major version (default 1); additive payload
# changes keep the version, breaking ones publish v2 in parallel for 12 months.
#
# Fields: producer = owning module (Django app); aggregate = CEDA entity; payload = field: type (! = required);
# consumers = modules/services that subscribe; trigger = when it is emitted.

events:
