  GOV.POLICY_PUBLISHED: {producer: governance, aggregate: policy_rule, payload: {policy_rule_id: uuid!, rule_key: code(40)!, version: int_u!, effective_from: date!}, consumers: [curriculum, attendance, intelligence, financing], trigger: A rule version is published after its tests pass}
